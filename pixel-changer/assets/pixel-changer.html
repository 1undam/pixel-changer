<title>Pixel Changer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout: toolbar / [settings column | two synced canvases] / palette + color decision + export. dark-first editor chrome */
:root{
  --bg:#141619; --panel:#1c1f24; --panel2:#23272d; --line:#2f343c; --line2:#3c424c;
  --fg:#e7e9ed; --muted:#8e95a1; --accent:#43d6c8; --accent-ink:#0b2724; --warn:#f2b640; --danger:#ef6b6b; --fixed:#5b9cf6;
  --checker-a:#2a2e35; --checker-b:#1f2228;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --line:#d7dbe2; --line2:#c3c9d2;
    --fg:#1a1d22; --muted:#5f6774; --accent:#0f9d91; --accent-ink:#ffffff; --warn:#b97a00; --danger:#c43c3c; --fixed:#2b6cd9;
    --checker-a:#dfe2e7; --checker-b:#f3f4f6;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --line:#d7dbe2; --line2:#c3c9d2;
  --fg:#1a1d22; --muted:#5f6774; --accent:#0f9d91; --accent-ink:#ffffff; --warn:#b97a00; --danger:#c43c3c; --fixed:#2b6cd9;
  --checker-a:#dfe2e7; --checker-b:#f3f4f6;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.ghost{background:transparent}
button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
input[type=number],select{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;width:64px;font-family:var(--mono);font-size:12px}
select{width:auto;font-family:var(--ui)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:14px;margin-right:4px}
.hint{color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sep{width:1px;height:22px;background:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:5px 10px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.status{color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--mono)}

.body{flex:1;min-height:0;display:flex}
.settings{width:290px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:10px}
.settings[hidden]{display:none}
.settings details{border-bottom:1px solid var(--line);padding:4px 0}
.settings summary{cursor:pointer;font-weight:600;padding:5px 0;list-style:none;display:flex;align-items:center;gap:6px}
.settings summary::before{content:"▸";color:var(--muted);font-size:11px}
.settings details[open] summary::before{content:"▾"}
.settings summary .st{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted);font-family:var(--mono)}
.rows{display:flex;flex-direction:column;gap:5px;padding:2px 0 6px 14px}
.row{display:flex;align-items:center;gap:8px;font-size:12px}
.row>span:first-child{flex:1;color:var(--muted)}
.row input[type=number]{width:70px}
.row select{max-width:170px}
.row.sub{padding-left:10px}
.note{font-size:11px;color:var(--muted);line-height:1.4;padding:2px 0}
.note b{color:var(--fg);font-weight:500}
.note.ok{color:var(--accent)}

.panes{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.pane{position:relative;min-width:0;min-height:0;background:var(--bg);display:flex;flex-direction:column}
.pane-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);min-height:29px}
.pane-head b{color:var(--fg);font-weight:600}
.pane-head .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-color:var(--checker-b);
  background-image:linear-gradient(45deg,var(--checker-a) 25%,transparent 25%,transparent 75%,var(--checker-a) 75%),linear-gradient(45deg,var(--checker-a) 25%,transparent 25%,transparent 75%,var(--checker-a) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.canvas-wrap.dragging{cursor:grabbing}
.canvas-wrap[data-tool="paint"],.canvas-wrap[data-tool="erase"],.canvas-wrap.picking{cursor:crosshair}
.canvas-wrap.picking{box-shadow:inset 0 0 0 3px var(--fixed)}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.bottom{display:grid;grid-template-columns:minmax(0,1fr) 360px auto;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.bottom>section{background:var(--panel);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.sec-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-title .r{margin-left:auto;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
.swatches{display:flex;flex-wrap:wrap;gap:4px;align-items:center;max-height:84px;overflow:auto}
.sw{width:22px;height:22px;border-radius:4px;border:1px solid var(--line2);cursor:pointer;position:relative;padding:0;flex:none}
.sw.focus{outline:2px solid var(--accent);outline-offset:1px}
.sw.brush{outline:2px solid var(--warn);outline-offset:1px}
.sw.removed{opacity:.35;border-color:var(--danger)}
.sw.removed::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:var(--danger);transform:rotate(-45deg)}
.sw.fixed{border:2px solid var(--fixed)}
.sw.fixed::before{content:"";position:absolute;right:-1px;top:-1px;border:5px solid transparent;border-top-color:var(--fixed);border-right-color:var(--fixed)}
.sw.unused{box-shadow:inset 0 0 0 2px var(--panel)}
.sw-add{width:22px;height:22px;padding:0;line-height:1;font-weight:600;flex:none}
.sw-add.on{background:var(--fixed);color:#fff;border-color:transparent}
.legend{color:var(--muted);font-size:11px;margin-top:6px;line-height:1.5}
.legend kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:0 4px;font-size:10px}

.insp{max-height:150px;overflow:auto;padding-right:4px;font-size:12px}
.insp-empty{color:var(--muted);font-size:12px;padding:6px 0}
.insp-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:5px;flex-wrap:wrap;font-family:var(--mono)}
.stage{display:flex;align-items:center;gap:8px;padding:2px 0}
.stage i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line2);display:block;flex:none}
.stage .nm{color:var(--muted);min-width:0}
.stage .hx{font-family:var(--mono);font-size:11px;margin-left:auto}
.stage.last .hx,.stage.last .nm{font-weight:600;color:var(--fg)}
.near{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:11px;color:var(--muted)}
.near .c{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:1px 7px 1px 3px}
.near .c i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line2)}
.near .c.pick{border-color:var(--accent)}
.hist{display:flex;gap:3px;margin-top:4px;height:10px;border-radius:3px;overflow:hidden}
.hist i{display:block;height:100%}
.pick-row{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:6px}
.pick-row .sw{width:16px;height:16px}
.pick-row .lbl{font-size:11px;color:var(--muted);margin-right:4px}

.export{display:flex;flex-direction:column;gap:6px;min-width:150px}
.export .row{display:flex;gap:6px;align-items:center}
.stats{font-size:11px;color:var(--muted);font-family:var(--mono)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:10px;max-width:min(92vw,900px);max-height:90vh;display:flex;flex-direction:column;gap:10px;padding:14px;overflow:auto}
.sheet img{image-rendering:pixelated;max-width:100%;max-height:60vh;border:1px solid var(--line)}
.sheet .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:6px;font-size:12px;z-index:30;pointer-events:none;max-width:90vw}

@media (max-width:900px){
  body{overflow:auto}
  .body{flex-direction:column}
  .settings{width:auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .panes{grid-template-columns:1fr;grid-template-rows:1fr 1fr;min-height:70vh}
  .bottom{grid-template-columns:1fr}
  .status{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:no-preference){ .sw,.stage{transition:outline-color .12s,background .12s} }
</style>

<header class="bar">
  <div class="brand">Pixel Changer</div>
  <button id="toggleSettings" title="설정 칸 접기/펼치기">⚙ 설정</button>
  <button class="filebtn">이미지 열기<input type="file" id="file" accept="image/*" aria-label="이미지 파일 선택"></button>
  <span class="hint">Ctrl+V 붙여넣기 · 드래그 앤 드롭</span>
  <div class="sep"></div>
  <button id="apply" class="primary" title="왼쪽 설정으로 다시 정리합니다">▶ 정리하기</button>
  <label class="chk"><input type="checkbox" id="auto" checked>값 바꾸면 자동</label>
  <label class="chk"><input type="checkbox" id="grid" checked>격자</label>
  <button id="fit">화면 맞춤</button>
  <div class="sep"></div>
  <div class="seg" role="group" aria-label="결과 편집 도구">
    <button data-tool="select" class="on" title="칸 클릭으로 색 판정 보기, 드래그로 이동">선택</button>
    <button data-tool="paint" title="붓 색으로 결과 칸 칠하기">칠하기</button>
    <button data-tool="erase" title="결과 칸을 투명으로">지우개</button>
  </div>
  <button id="undo" class="ghost" title="Ctrl+Z" disabled>되돌리기</button>
  <span class="status" id="status">이미지를 기다리는 중</span>
</header>

<div class="body">
<aside class="settings" id="settings">
  <details open>
    <summary>1. 배경 지우기 <span class="st" id="st-bg"></span></summary>
    <div class="rows">
      <label class="row"><span>방식</span><select data-set="bgMode"><option value="none">지우지 않음</option><option value="auto">자동 (테두리에서 가장 많은 색)</option></select></label>
      <label class="row"><span>허용 오차 (RGB 거리)</span><input type="number" data-set="bgTol" min="0" max="200" step="1"></label>
      <label class="row"><span>테두리와 이어진 배경만</span><input type="checkbox" data-set="bgBorderOnly"></label>
      <div class="note">원래 투명한 그림(PNG)은 테두리가 거의 투명하면 원래 투명도를 그대로 씁니다.</div>
    </div>
  </details>
  <details open>
    <summary>2. 픽셀 격자 <span class="st" id="st-grid"></span></summary>
    <div class="rows">
      <label class="row"><span>칸 크기 기준</span><select data-set="gridMode"><option value="auto">자동 (색 경계로 찾기)</option><option value="manual">수동 (칸 크기·오프셋)</option><option value="fixed">결과 크기 고정</option></select></label>
      <div id="grid-auto">
        <label class="row"><span>찾을 칸 크기 범위 (px)</span><input type="number" data-set="sMin" min="2" max="128" step="1"> ~ <input type="number" data-set="sMax" min="3" max="256" step="1"></label>
        <label class="row"><span>색 경계로 볼 차이</span><input type="number" data-set="edgeThr" min="4" max="120" step="1"></label>
        <div class="note" id="gridInfo">—</div>
        <div class="row"><button id="toManual" class="ghost">찾은 값을 수동으로</button></div>
      </div>
      <div id="grid-manual" hidden>
        <label class="row"><span>칸 크기 (px, 소수 가능)</span><input type="number" data-set="cellSize" min="1" max="512" step="0.25"></label>
        <label class="row"><span>오프셋 X · Y</span><input type="number" data-set="offX" min="-512" max="512" step="1"> <input type="number" data-set="offY" min="-512" max="512" step="1"></label>
      </div>
      <div id="grid-fixed" hidden>
        <label class="row"><span>결과 가로 × 세로</span><input type="number" data-set="outW" min="1" max="1024" step="1"> × <input type="number" data-set="outH" min="1" max="1024" step="1"></label>
        <label class="row"><span>비율 고정</span><input type="checkbox" data-set="lock"></label>
      </div>
      <label class="row"><span>칸 경계를 실제 색 경계에 맞춤</span><input type="checkbox" data-set="snap"></label>
      <label class="row sub"><span>최대 이동 (칸의 %)</span><input type="number" data-set="snapPct" min="0" max="49" step="1"></label>
    </div>
  </details>
  <details open>
    <summary>3. 칸 색 고르기 <span class="st" id="st-cell"></span></summary>
    <div class="rows">
      <label class="row"><span>방식</span><select data-set="cellMethod"><option value="mode">살짝 모은 뒤 가장 많은 색</option><option value="median">중앙값</option><option value="center">가운데 픽셀</option><option value="average">평균</option><option value="cw">중심 가중 평균</option></select></label>
      <label class="row"><span>색 묶기 간격 (RGB)</span><input type="number" data-set="bucket" min="2" max="96" step="1"></label>
      <label class="row"><span>칸 테두리 무시 (%)</span><input type="number" data-set="margin" min="0" max="40" step="1"></label>
      <label class="row"><span>투명 기준 (불투명 %)</span><input type="number" data-set="alphaThr" min="1" max="100" step="1"></label>
    </div>
  </details>
  <details open>
    <summary>4. 팔레트 <span class="st" id="st-pal"></span></summary>
    <div class="rows">
      <label class="row"><span>방식</span><select data-set="palMode"><option value="kmeans">k-평균 (OKLab)</option><option value="oklch">OKLCH 묶기 (색 수 자동)</option><option value="mediancut">중앙 분할</option><option value="keep">원래 색 유지</option></select></label>
      <label class="row" id="row-ncolors"><span>색 수</span><input type="number" data-set="nColors" min="2" max="64" step="1"></label>
      <div id="row-oklch" hidden>
        <label class="row"><span>묶을 범위 L · C · H°</span><input type="number" data-set="rL" min="0.01" max="0.5" step="0.01"> <input type="number" data-set="rC" min="0.01" max="0.5" step="0.01"> <input type="number" data-set="rH" min="1" max="180" step="1"></label>
      </div>
      <label class="row"><span>팔레트 색</span><select data-set="palRep"><option value="original">원본 색 (묶음에서 가장 많이 쓰인 칸 색)</option><option value="average">평균 색</option></select></label>
      <label class="row"><span>색 거리</span><select data-set="dist"><option value="hue">OKLCh 색상 가중</option><option value="oklab">OKLab</option></select></label>
      <label class="row sub"><span>색상 무게</span><input type="number" data-set="hueW" min="0" max="20" step="0.5"></label>
      <label class="row"><span>명암 계열 우선</span><input type="checkbox" data-set="shade"></label>
      <label class="row"><span>어두운 색을 외곽선 색 하나로</span><input type="checkbox" data-set="darkUnify"></label>
      <label class="row sub"><span>외곽선 밝기 (L 이하)</span><input type="number" data-set="darkL" min="0.05" max="0.6" step="0.01"></label>
    </div>
  </details>
  <details>
    <summary>5. 정리 <span class="st" id="st-clean"></span></summary>
    <div class="rows">
      <label class="row"><span>외톨이 픽셀 지우기</span><input type="checkbox" data-set="isolated"></label>
      <label class="row sub"><span>최대 대비 (OKLab, 눈동자는 남김)</span><input type="number" data-set="isoContrast" min="0.05" max="1" step="0.05"></label>
      <label class="row"><span>1px 구멍 메우기</span><input type="checkbox" data-set="holes"></label>
    </div>
  </details>
</aside>

<main class="panes">
  <section class="pane">
    <div class="pane-head"><span><b>결과</b> · <span id="resInfo" class="mono">—</span></span><span class="mono" id="zoomInfo"></span></div>
    <div class="canvas-wrap" id="wrapR"><canvas id="cvR"></canvas></div>
  </section>
  <section class="pane">
    <div class="pane-head"><span><b>원본</b> · <span id="srcInfo" class="mono">—</span></span><span id="hoverInfo" class="mono"></span></div>
    <div class="canvas-wrap" id="wrapS"><canvas id="cvS"></canvas></div>
  </section>
</main>
</div>

<footer class="bottom">
  <section>
    <div class="sec-title">색 <span id="palCount" class="mono"></span>
      <span class="r"><span id="removedInfo" class="hint"></span><button id="restoreAll" class="ghost" hidden>모두 되살리기</button><button id="unfixAll" class="ghost" hidden>고정 모두 해제</button></span>
    </div>
    <div class="swatches" id="swatches"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section>
    <div class="sec-title">색 판정 <span class="r"><button id="clearOverride" class="ghost" hidden>직접 지정 해제</button></span></div>
    <div class="insp" id="inspector"><div class="insp-empty">결과 픽셀이나 원본 칸을 클릭하면 그 칸의 색이 단계별로 어떻게 정해졌는지 보여줍니다.</div></div>
  </section>
  <section class="export">
    <div class="sec-title">내보내기</div>
    <div class="row"><label for="scale" class="hint">배율</label>
      <select id="scale"><option value="1">×1 (원본 픽셀)</option><option value="4">×4</option><option value="8" selected>×8</option><option value="16">×16</option></select>
    </div>
    <div class="row"><button id="exportBtn" class="primary">PNG 만들기</button></div>
    <div class="stats" id="stats"></div>
  </section>
</footer>

<div class="overlay" id="exportOverlay" hidden>
  <div class="sheet">
    <div class="row"><b id="exportTitle">PNG</b><span class="hint">이미지를 우클릭해 저장하거나 복사하세요.</span></div>

/* ======================= sample: an "AI-looking" pixel image with uneven 9px cells, soft edges and a flat background ======================= */
function sampleImage() {
  const W = 40, H = 46, px = 9, c = document.createElement('canvas'); c.width = W * px + 40; c.height = H * px + 40; const g = c.getContext('2d');
  g.fillStyle = '#f2efe6'; g.fillRect(0, 0, c.width, c.height);
  const seed = 7; let r = seed; const rnd = () => { r = (r * 1103515245 + 12345) & 0x7fffffff; return r / 0x7fffffff; };

  const body = (x, y) => { const dx = (x - 20) / 15, dy = (y - 24) / 17; return dx * dx + dy * dy <= 1; };
  const head = (x, y) => { const dx = (x - 20) / 10, dy = (y - 13) / 9; return dx * dx + dy * dy <= 1; };
  const belly = (x, y) => { const dx = (x - 20) / 9, dy = (y - 29) / 9; return dx * dx + dy * dy <= 1; };
  const eye = (x, y) => (Math.hypot(x - 16, y - 12) <= 1.6) || (Math.hypot(x - 24, y - 12) <= 1.6);
  const glint = (x, y) => (x === 15 && y === 11) || (x === 23 && y === 11);
  const beak = (x, y) => y >= 14 && y <= 17 && Math.abs(x - 20) <= (17 - y);
  const cheek = (x, y) => Math.hypot(x - 12, y - 15) <= 2 || Math.hypot(x - 28, y - 15) <= 2;
  const feet = (x, y) => y >= 41 && y <= 44 && ((x >= 13 && x <= 17) || (x >= 23 && x <= 27)) && (y === 41 || (x % 2 === 1));
  const wing = (x, y) => { const dx = (x - 9) / 4, dy = (y - 26) / 7; return dx * dx + dy * dy <= 1; } ;
  const wing2 = (x, y) => { const dx = (x - 31) / 4, dy = (y - 26) / 7; return dx * dx + dy * dy <= 1; };
  const inside = (x, y) => body(x, y) || head(x, y);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let col = null;
    if (feet(x, y)) col = '#e58a1f';
    else if (inside(x, y)) {
      const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
      col = edge ? '#2b1d12' : belly(x, y) ? '#fff3c2' : (wing(x, y) || wing2(x, y)) ? '#e9b53a' : y > 30 ? '#f0c23f' : '#f7d24c';
      if (glint(x, y)) col = '#ffffff'; else if (eye(x, y)) col = '#2b1d12'; else if (beak(x, y)) col = '#f08a1d'; else if (cheek(x, y)) col = '#f3a2a0';
    }
